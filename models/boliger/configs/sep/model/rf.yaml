name: rf

# RandomForest 하이퍼파라미터 (v3.3: Regularization 강화)
n_estimators: 300
max_depth: 6              # 12 → 6 (트리 깊이 절반)
min_samples_split: 50     # 10 → 50 (분할 기준 ↑)
min_samples_leaf: 20      # 5 → 20 (리프 최소 샘플 ↑)
max_features: 0.3         # "sqrt" → 0.3 (피처 30%만 사용)

# 공통 설정
n_jobs: -1
random_state: 42
verbose: 0
